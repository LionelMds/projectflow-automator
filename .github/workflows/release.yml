name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual run from main: the tag is the pyproject version, created with the release.
  workflow_dispatch:
    inputs:
      prerelease:
        # The in-app updater reads /releases/latest, which never returns a pre-release:
        # only the machines where it is installed by hand get it.
        description: "Pre-release : pas proposee par la mise a jour automatique"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Le tag $tag existe deja : augmentez la version dans pyproject.toml."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build Windows
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[packaging]"
      - name: Embed app settings
        shell: python
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECTFLOW_MICROSOFT_CLIENT_ID: ${{ secrets.PROJECTFLOW_MICROSOFT_CLIENT_ID }}
        run: |
          import json
          import os
          from pathlib import Path

          owner, repo = os.environ.get("GITHUB_REPOSITORY", "/").split("/", 1)
          client_id = (
              os.environ.get("PROJECTFLOW_MICROSOFT_CLIENT_ID", "").strip()
              or "ced436ff-2be9-4792-8551-02e12351c6c9"
          )
          path = Path("src/projectflow/resources/app_settings.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(
                  {
                      "github_owner": owner,
                      "github_repo": repo,
                      "microsoft_client_id": client_id,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
      - name: Build exe
        run: python -m projectflow.build --target windows
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          $env:PROJECTFLOW_VERSION = $env:RELEASE_VERSION.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\ProjectFlowAutomator.iss
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          foreach ($file in @("dist\ProjectFlowAutomator.exe", "dist\ProjectFlowAutomatorSetup.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name" | Set-Content -NoNewline -Encoding ascii "$file.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectFlowAutomator-windows
          path: |
            dist/ProjectFlowAutomator.exe
            dist/ProjectFlowAutomator.exe.sha256
            dist/ProjectFlowAutomatorSetup.exe
            dist/ProjectFlowAutomatorSetup.exe.sha256

  build-macos:
    name: Build macOS
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[packaging]"
      - name: Embed app settings
        shell: python
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECTFLOW_MICROSOFT_CLIENT_ID: ${{ secrets.PROJECTFLOW_MICROSOFT_CLIENT_ID }}
        run: |
          import json
          import os
          from pathlib import Path

          owner, repo = os.environ.get("GITHUB_REPOSITORY", "/").split("/", 1)
          client_id = (
              os.environ.get("PROJECTFLOW_MICROSOFT_CLIENT_ID", "").strip()
              or "ced436ff-2be9-4792-8551-02e12351c6c9"
          )
          path = Path("src/projectflow/resources/app_settings.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(
                  {
                      "github_owner": owner,
                      "github_repo": repo,
                      "microsoft_client_id": client_id,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
      - name: Build app
        run: python -m projectflow.build --target macos
      # Signing needs the six Apple secrets. None set: the build stays unsigned, as before.
      # Only some set: stop, so a mistyped secret name never ships an unsigned release unnoticed.
      # The secrets are handed to the signing steps only, never to pip or brew.
      - name: Check signing secrets
        id: signing
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PWD: ${{ secrets.APPLE_APP_PWD }}
        run: |
          missing=""
          present=0
          for name in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_DEVELOPER_ID \
            APPLE_ID APPLE_TEAM_ID APPLE_APP_PWD; do
            if [ -n "${!name}" ]; then
              present=$((present + 1))
            else
              missing="$missing $name"
            fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning::Secrets Apple absents : l'application macOS n'est ni signee ni notarisee."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::Secrets Apple manquants :$missing"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      # codesign reads the Developer ID certificate and its private key from a keychain:
      # a temporary one, created for this run on a runner that is thrown away afterwards.
      - name: Import signing certificate
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          cert_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo -n "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychain -d user -s "$keychain_path"
          rm -f "$cert_path"
      - name: Sign app
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          codesign --deep --force --timestamp --options runtime \
            --entitlements "installer/macos/entitlements.plist" \
            --sign "$APPLE_DEVELOPER_ID" \
            "dist/ProjectFlow Automator.app"
          codesign --verify --deep --strict "dist/ProjectFlow Automator.app"
      - name: Notarize app
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PWD: ${{ secrets.APPLE_APP_PWD }}
        run: |
          ditto -c -k --keepParent "dist/ProjectFlow Automator.app" "dist/ProjectFlow Automator.zip"
          xcrun notarytool submit "dist/ProjectFlow Automator.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PWD" \
            --wait
          # A refused notarization leaves no ticket: stapling fails and stops the release.
          xcrun stapler staple "dist/ProjectFlow Automator.app"
      - name: Create DMG
        run: |
          brew install create-dmg
          rm -rf "dist/dmg"
          mkdir -p "dist/dmg"
          ditto "dist/ProjectFlow Automator.app" "dist/dmg/ProjectFlow Automator.app"
          create-dmg \
            --volname "ProjectFlow Automator" \
            --window-size 620 380 \
            --icon-size 96 \
            --icon "ProjectFlow Automator.app" 170 160 \
            --app-drop-link 450 160 \
            "dist/ProjectFlow Automator.dmg" \
            "dist/dmg"
      # The DMG is what users download: signed and notarized too, before its checksum is taken.
      - name: Sign and notarize DMG
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PWD: ${{ secrets.APPLE_APP_PWD }}
        run: |
          codesign --force --timestamp --sign "$APPLE_DEVELOPER_ID" "dist/ProjectFlow Automator.dmg"
          xcrun notarytool submit "dist/ProjectFlow Automator.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PWD" \
            --wait
          xcrun stapler staple "dist/ProjectFlow Automator.dmg"
      - name: Generate macOS checksum
        run: |
          shasum -a 256 "dist/ProjectFlow Automator.dmg" \
            | sed 's#dist/##' > "dist/ProjectFlow Automator.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectFlowAutomator-macos
          path: |
            dist/ProjectFlow Automator.dmg
            dist/ProjectFlow Automator.dmg.sha256

  publish:
    name: Publish GitHub Release
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        shell: python
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^##\s+\[?{re.escape(version)}\]?.*?\n(?P<body>.*?)(?=^##\s+|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          body = match.group("body").strip() if match else changelog.strip()
          Path("release-notes.md").write_text(body or f"ProjectFlow {version}", encoding="utf-8")
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Third-party action with write access to the releases the app installs from:
      # pinned to a commit, a moved tag cannot change what it runs.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease == true }}
          body_path: release-notes.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.sha256
