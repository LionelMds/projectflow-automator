name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[packaging]"
      - name: Embed app settings
        shell: python
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECTFLOW_MICROSOFT_CLIENT_ID: ${{ secrets.PROJECTFLOW_MICROSOFT_CLIENT_ID }}
        run: |
          import json
          import os
          from pathlib import Path

          owner, repo = os.environ.get("GITHUB_REPOSITORY", "/").split("/", 1)
          client_id = (
              os.environ.get("PROJECTFLOW_MICROSOFT_CLIENT_ID", "").strip()
              or "ced436ff-2be9-4792-8551-02e12351c6c9"
          )
          path = Path("src/projectflow/resources/app_settings.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(
                  {
                      "github_owner": owner,
                      "github_repo": repo,
                      "microsoft_client_id": client_id,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
      - name: Build exe
        run: python -m projectflow.build --target windows
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $env:PROJECTFLOW_VERSION = $env:RELEASE_VERSION.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\ProjectFlowAutomator.iss
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          foreach ($file in @("dist\ProjectFlowAutomator.exe", "dist\ProjectFlowAutomatorSetup.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name" | Set-Content -NoNewline -Encoding ascii "$file.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectFlowAutomator-windows
          path: |
            dist/ProjectFlowAutomator.exe
            dist/ProjectFlowAutomator.exe.sha256
            dist/ProjectFlowAutomatorSetup.exe
            dist/ProjectFlowAutomatorSetup.exe.sha256

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    env:
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PWD: ${{ secrets.APPLE_APP_PWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[packaging]"
      - name: Embed app settings
        shell: python
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECTFLOW_MICROSOFT_CLIENT_ID: ${{ secrets.PROJECTFLOW_MICROSOFT_CLIENT_ID }}
        run: |
          import json
          import os
          from pathlib import Path

          owner, repo = os.environ.get("GITHUB_REPOSITORY", "/").split("/", 1)
          client_id = (
              os.environ.get("PROJECTFLOW_MICROSOFT_CLIENT_ID", "").strip()
              or "ced436ff-2be9-4792-8551-02e12351c6c9"
          )
          path = Path("src/projectflow/resources/app_settings.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(
                  {
                      "github_owner": owner,
                      "github_repo": repo,
                      "microsoft_client_id": client_id,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
      - name: Build app
        run: python -m projectflow.build --target macos
      - name: Sign app
        if: ${{ env.APPLE_DEVELOPER_ID != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PWD != '' }}
        run: |
          codesign --deep --force --options runtime \
            --entitlements "installer/macos/entitlements.plist" \
            --sign "$APPLE_DEVELOPER_ID" \
            "dist/ProjectFlow Automator.app"
      - name: Zip app for notarization
        run: ditto -c -k --keepParent "dist/ProjectFlow Automator.app" "dist/ProjectFlow Automator.zip"
      - name: Notarize app
        if: ${{ env.APPLE_DEVELOPER_ID != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PWD != '' }}
        run: |
          xcrun notarytool submit "dist/ProjectFlow Automator.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PWD" \
            --wait
          xcrun stapler staple "dist/ProjectFlow Automator.app"
      - name: Create DMG
        run: |
          brew install create-dmg
          rm -rf "dist/dmg"
          mkdir -p "dist/dmg"
          ditto "dist/ProjectFlow Automator.app" "dist/dmg/ProjectFlow Automator.app"
          create-dmg \
            --volname "ProjectFlow Automator" \
            --window-size 620 380 \
            --icon-size 96 \
            --icon "ProjectFlow Automator.app" 170 160 \
            --app-drop-link 450 160 \
            "dist/ProjectFlow Automator.dmg" \
            "dist/dmg"
      - name: Generate macOS checksum
        run: |
          shasum -a 256 "dist/ProjectFlow Automator.dmg" \
            | sed 's#dist/##' > "dist/ProjectFlow Automator.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectFlowAutomator-macos
          path: |
            dist/ProjectFlow Automator.dmg
            dist/ProjectFlow Automator.dmg.sha256

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        shell: python
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^##\s+\[?{re.escape(version)}\]?.*?\n(?P<body>.*?)(?=^##\s+|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          body = match.group("body").strip() if match else changelog.strip()
          Path("release-notes.md").write_text(body or f"ProjectFlow {version}", encoding="utf-8")
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.sha256
